; margin build environments, layered on top of PapyriX.
; scripts/setup.sh links this file into the submodule as platformio.local.ini, which PapyriX's
; platformio.ini already loads via `extra_configs = platformio.local.ini`. Paths below are
; relative to firmware/upstream/papyrix-reader (the PlatformIO project dir).

[margin]
version = 0.1.0-scaffold
lib_deps =
  h2zero/NimBLE-Arduino @ ^2.3.0
  symlink://../../lib/MarginProtocol
  symlink://../../lib/MarginChat
  symlink://../../lib/MarginBle
  symlink://../../lib/MarginApp
build_flags =
  -DMARGIN_ENABLE_CHAT=1
  -DMARGIN_VERSION=\"${margin.version}\"
; NimBLE limits (connections, bonds, roles) come from the Arduino core's precompiled sdkconfig;
; redefining CONFIG_BT_NIMBLE_* here only produces warnings. TODO(M2): trim via a custom sdkconfig
; (pioarduino `custom_sdkconfig`) if flash/RAM gets tight.

; Development build for the X4 Pro (ESP32-S3). Same board profile as PapyriX's env:x4pro.
[env:margin_x4pro]
extends = env:x4pro
build_flags =
  ${env:x4pro.build_flags}
  ${margin.build_flags}
lib_deps =
  ${base.lib_deps}
  ${margin.lib_deps}

; Release flavour (lower log level), mirrors PapyriX's env:release_x4pro.
[env:margin_release_x4pro]
extends = env:release_x4pro
build_flags =
  ${env:release_x4pro.build_flags}
  ${margin.build_flags}
lib_deps =
  ${base.lib_deps}
  ${margin.lib_deps}
