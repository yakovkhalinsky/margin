; margin build environments for CrossPoint Reader
; This file is symlinked as platformio.local.ini in the CrossPoint submodule

[crosspoint_margin]
version = 0.1.0

; margin X4 Pro: CrossPoint x4pro + margin Bible library
[env:margin_x4pro]
extends = env:x4pro
build_flags =
    ${env:x4pro.build_flags}
    -DMARGIN_ENABLE_BIBLE=1
    -DMARGIN_VERSION=\"${crosspoint_margin.version}\"
; Add margin libraries
lib_extra_dirs =
    ../../lib
build_src_filter =
    ${env:x4pro.build_src_filter}
    +<margin/>

; margin X4 Pro release build (no serial logging)
[env:margin_x4pro_release]
extends = env:margin_x4pro
build_flags =
    ${env:margin_x4pro.build_flags}
    -DRELEASE_BUILD=1
build_unflags =
    -DENABLE_SERIAL_LOG
    -DCROSSPOINT_WAIT_FOR_USB_SERIAL
