name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: |
          pip install platformio esptool

      - name: Setup firmware environment
        run: |
          cd firmware
          ./scripts/setup.sh

      - name: Build margin firmware
        env:
          MARGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd firmware/upstream/crosspoint-reader
          pio run -e margin_x4pro_release

      - name: Verify build artifacts exist
        id: artifacts
        run: |
          BUILD_DIR="firmware/upstream/crosspoint-reader/.pio/build/margin_x4pro_release"
          
          echo "Build directory contents:"
          ls -la "$BUILD_DIR/"
          
          # Verify required files exist
          test -f "$BUILD_DIR/bootloader.bin" || { echo "ERROR: bootloader.bin not found"; exit 1; }
          test -f "$BUILD_DIR/partitions.bin" || { echo "ERROR: partitions.bin not found"; exit 1; }
          test -f "$BUILD_DIR/firmware.bin" || { echo "ERROR: firmware.bin not found"; exit 1; }
          
          # Find boot_app0.bin in PlatformIO packages
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name "boot_app0.bin" -path "*/partitions/*" | head -1)
          if [ -z "$BOOT_APP0" ] || [ ! -f "$BOOT_APP0" ]; then
            echo "ERROR: boot_app0.bin not found in PlatformIO packages"
            find ~/.platformio/packages -name "boot_app0.bin" 2>/dev/null || true
            exit 1
          fi
          
          echo "boot_app0=$BOOT_APP0" >> "$GITHUB_OUTPUT"
          echo "All required files found:"
          echo "  Bootloader: $BUILD_DIR/bootloader.bin"
          echo "  Partitions: $BUILD_DIR/partitions.bin"
          echo "  Boot app0:  $BOOT_APP0"
          echo "  Firmware:   $BUILD_DIR/firmware.bin"

      - name: Create merged firmware binary
        env:
          BOOT_APP0: ${{ steps.artifacts.outputs.boot_app0 }}
        run: |
          BUILD_DIR="firmware/upstream/crosspoint-reader/.pio/build/margin_x4pro_release"
          mkdir -p dist
          
          # ESP32-S3 flash offsets (verified against CrossPoint partitions.csv):
          # - Bootloader: 0x0 (ESP32-S3 uses 0x0, not 0x1000 like ESP32)
          # - Partition table: 0x8000
          # - OTA data (boot_app0): 0xe000
          # - Application: 0x10000
          esptool --chip esp32s3 merge-bin \
            -o "dist/margin-x4pro-merged.bin" \
            --flash-mode dio \
            --flash-freq 80m \
            --flash-size 16MB \
            0x0 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"
          
          cp "$BUILD_DIR/firmware.bin" "dist/margin-x4pro-app.bin"
          
          echo "Created binaries:"
          ls -la dist/

      - name: Download CrossPoint X4 Pro firmware
        run: |
          mkdir -p dist/flasher/firmware
          
          # Download latest CrossPoint X4 Pro release for "restore stock" option
          # CrossPoint is MIT licensed, redistribution allowed
          curl -fsSL -o dist/flasher/firmware/crosspoint-x4pro.bin \
            "https://github.com/crosspoint-reader/crosspoint-reader/releases/latest/download/firmware-x4pro.bin"
          
          echo "Downloaded CrossPoint firmware:"
          ls -la dist/flasher/firmware/

      - name: Prepare flasher site with bundled firmware
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Copy margin firmware to flasher directory
          cp dist/margin-x4pro-merged.bin dist/flasher/firmware/
          
          # Copy static flasher files
          cp flasher/index.html dist/flasher/
          
          # Generate margin manifest with relative path (avoids CORS issues)
          python3 -c "
          import json
          manifest = {
              'name': 'margin',
              'version': '$VERSION',
              'new_install_prompt_erase': True,
              'builds': [{
                  'chipFamily': 'ESP32-S3',
                  'parts': [{
                      'path': 'firmware/margin-x4pro-merged.bin',
                      'offset': 0
                  }]
              }]
          }
          with open('dist/flasher/manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          "
          
          # Generate CrossPoint manifest with relative path
          python3 -c "
          import json
          manifest = {
              'name': 'CrossPoint Reader',
              'version': 'latest',
              'new_install_prompt_erase': False,
              'builds': [{
                  'chipFamily': 'ESP32-S3',
                  'parts': [{
                      'path': 'firmware/crosspoint-x4pro.bin',
                      'offset': 65536
                  }]
              }]
          }
          with open('dist/flasher/crosspoint-manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          "
          
          echo "Flasher site contents:"
          find dist/flasher -type f -exec ls -la {} \;
          
          echo "Manifest files:"
          cat dist/flasher/manifest.json
          echo ""
          cat dist/flasher/crosspoint-manifest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"
          
          # Check if release exists (for workflow_dispatch)
          if ! gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "margin $VERSION" \
              --notes "## margin $VERSION for Xteink X4 Pro

          ### Downloads
          - **margin-x4pro-merged.bin**: Full firmware (bootloader + partitions + app) - use with the web flasher
          - **margin-x4pro-app.bin**: App only at 0x10000 (for updates when bootloader hasn't changed)

          ### Web Flasher
          Flash directly from your browser: https://yakov.khalinsky.com/margin/

          > **Note**: WebSerial requires HTTPS. If the flasher doesn't work, ensure 'Enforce HTTPS' is enabled in GitHub Pages settings.

          ### Flash Offsets (for manual flashing)
          \`\`\`bash
          # Merged binary (recommended):
          esptool.py --chip esp32s3 write_flash 0x0 margin-x4pro-merged.bin

          # App only:
          esptool.py --chip esp32s3 write_flash 0x10000 margin-x4pro-app.bin
          \`\`\`

          ### What's New
          See the [commit history](https://github.com/${{ github.repository }}/commits/main) for details.
          "
          fi
          
          # Upload assets
          gh release upload "$TAG" \
            dist/margin-x4pro-merged.bin \
            dist/margin-x4pro-app.bin \
            --repo "${{ github.repository }}" \
            --clobber

  deploy-pages:
    needs: [build, release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/flasher/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
