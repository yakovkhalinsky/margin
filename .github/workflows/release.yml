name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: |
          pip install platformio esptool

      - name: Setup firmware environment
        run: |
          cd firmware
          ./scripts/setup.sh

      - name: Build margin firmware
        env:
          MARGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd firmware/upstream/crosspoint-reader
          pio run -e margin_x4pro_release

      - name: Build stock CrossPoint x4pro (for restore image)
        run: |
          cd firmware/upstream/crosspoint-reader
          pio run -e x4pro

      - name: Verify build artifacts exist
        id: artifacts
        run: |
          MARGIN_DIR="firmware/upstream/crosspoint-reader/.pio/build/margin_x4pro_release"
          STOCK_DIR="firmware/upstream/crosspoint-reader/.pio/build/x4pro"
          
          echo "=== margin build ==="
          ls -la "$MARGIN_DIR/"
          
          echo "=== stock x4pro build ==="
          ls -la "$STOCK_DIR/"
          
          # Verify margin files
          test -f "$MARGIN_DIR/bootloader.bin" || { echo "ERROR: margin bootloader.bin not found"; exit 1; }
          test -f "$MARGIN_DIR/partitions.bin" || { echo "ERROR: margin partitions.bin not found"; exit 1; }
          test -f "$MARGIN_DIR/firmware.bin" || { echo "ERROR: margin firmware.bin not found"; exit 1; }
          
          # Verify stock x4pro files (separate parts for safer flashing)
          test -f "$STOCK_DIR/bootloader.bin" || { echo "ERROR: stock bootloader.bin not found"; exit 1; }
          test -f "$STOCK_DIR/partitions.bin" || { echo "ERROR: stock partitions.bin not found"; exit 1; }
          test -f "$STOCK_DIR/firmware.bin" || { echo "ERROR: stock firmware.bin not found"; exit 1; }
          
          # Find boot_app0.bin
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name "boot_app0.bin" -path "*/partitions/*" | head -1)
          echo "boot_app0=$BOOT_APP0" >> "$GITHUB_OUTPUT"
          echo "Boot app0: $BOOT_APP0"
          
          if [ -z "$BOOT_APP0" ]; then
            echo "ERROR: boot_app0.bin not found in PlatformIO packages"
            exit 1
          fi

      - name: Compare flash settings with official CrossPoint
        run: |
          echo "=== Comparing flash settings ==="
          
          # Download official CrossPoint X4 Pro binary
          curl -fsSL -o /tmp/official-crosspoint-x4pro.bin \
            "https://github.com/crosspoint-reader/crosspoint-reader/releases/latest/download/firmware-x4pro.bin"
          
          MARGIN_FW="firmware/upstream/crosspoint-reader/.pio/build/margin_x4pro_release/firmware.bin"
          MARGIN_BL="firmware/upstream/crosspoint-reader/.pio/build/margin_x4pro_release/bootloader.bin"
          STOCK_FW="firmware/upstream/crosspoint-reader/.pio/build/x4pro/firmware.bin"
          
          echo "--- Official CrossPoint release ---"
          esptool image-info /tmp/official-crosspoint-x4pro.bin 2>&1 | grep -E "Flash size|Flash freq|Flash mode|Entry point"
          
          echo "--- margin firmware ---"
          esptool image-info "$MARGIN_FW" 2>&1 | grep -E "Flash size|Flash freq|Flash mode|Entry point"
          
          echo "--- margin bootloader ---"
          esptool image-info "$MARGIN_BL" 2>&1 | grep -E "Flash size|Flash freq|Flash mode|Entry point"
          
          echo "--- stock x4pro firmware (our build) ---"
          esptool image-info "$STOCK_FW" 2>&1 | grep -E "Flash size|Flash freq|Flash mode|Entry point"
          
          # Extract and compare flash settings
          OFFICIAL_MODE=$(esptool image-info /tmp/official-crosspoint-x4pro.bin 2>&1 | grep "Flash mode:" | awk '{print $3}')
          OFFICIAL_FREQ=$(esptool image-info /tmp/official-crosspoint-x4pro.bin 2>&1 | grep "Flash freq:" | awk '{print $3}')
          OFFICIAL_SIZE=$(esptool image-info /tmp/official-crosspoint-x4pro.bin 2>&1 | grep "Flash size:" | awk '{print $3}')
          
          MARGIN_MODE=$(esptool image-info "$MARGIN_FW" 2>&1 | grep "Flash mode:" | awk '{print $3}')
          MARGIN_FREQ=$(esptool image-info "$MARGIN_FW" 2>&1 | grep "Flash freq:" | awk '{print $3}')
          MARGIN_SIZE=$(esptool image-info "$MARGIN_FW" 2>&1 | grep "Flash size:" | awk '{print $3}')
          
          echo ""
          echo "=== Flash Settings Comparison ==="
          echo "Official CrossPoint: mode=$OFFICIAL_MODE freq=$OFFICIAL_FREQ size=$OFFICIAL_SIZE"
          echo "margin firmware:     mode=$MARGIN_MODE freq=$MARGIN_FREQ size=$MARGIN_SIZE"
          
          # Check for mismatches (warning only, don't fail)
          MISMATCH=0
          if [ "$OFFICIAL_MODE" != "$MARGIN_MODE" ]; then
            echo "WARNING: Flash mode mismatch! Official=$OFFICIAL_MODE, margin=$MARGIN_MODE"
            MISMATCH=1
          fi
          if [ "$OFFICIAL_FREQ" != "$MARGIN_FREQ" ]; then
            echo "WARNING: Flash freq mismatch! Official=$OFFICIAL_FREQ, margin=$MARGIN_FREQ"
            MISMATCH=1
          fi
          if [ "$OFFICIAL_SIZE" != "$MARGIN_SIZE" ]; then
            echo "WARNING: Flash size mismatch! Official=$OFFICIAL_SIZE, margin=$MARGIN_SIZE"
            MISMATCH=1
          fi
          
          if [ "$MISMATCH" -eq 0 ]; then
            echo "✓ All flash settings match official CrossPoint"
          fi

      - name: Prepare distribution files
        env:
          BOOT_APP0: ${{ steps.artifacts.outputs.boot_app0 }}
        run: |
          mkdir -p dist/firmware
          
          MARGIN_DIR="firmware/upstream/crosspoint-reader/.pio/build/margin_x4pro_release"
          STOCK_DIR="firmware/upstream/crosspoint-reader/.pio/build/x4pro"
          
          # Copy stock CrossPoint separate parts for safe restore
          # Using separate parts avoids the ESP32-S3 native USB write failure
          # that can occur with large merged binaries
          cp "$STOCK_DIR/bootloader.bin" "dist/firmware/bootloader.bin"
          cp "$STOCK_DIR/partitions.bin" "dist/firmware/partitions.bin"
          cp "$BOOT_APP0" "dist/firmware/boot_app0.bin"
          cp "$STOCK_DIR/firmware.bin" "dist/firmware/crosspoint-x4pro-app.bin"
          
          # margin app-only (for debugging - margin install is DISABLED)
          cp "$MARGIN_DIR/firmware.bin" "dist/margin-x4pro-app.bin"
          
          echo "=== Distribution files ==="
          ls -la dist/
          ls -la dist/firmware/

      - name: Prepare flasher site (margin DISABLED, CrossPoint uses separate parts)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/flasher/firmware
          
          # Copy separate CrossPoint parts for web flasher
          cp dist/firmware/bootloader.bin dist/flasher/firmware/
          cp dist/firmware/partitions.bin dist/flasher/firmware/
          cp dist/firmware/boot_app0.bin dist/flasher/firmware/
          cp dist/firmware/crosspoint-x4pro-app.bin dist/flasher/firmware/
          
          # Copy static flasher files
          cp flasher/index.html dist/flasher/
          
          # Generate DISABLED margin manifest
          python3 -c "
          import json
          manifest = {
              'name': 'margin - DISABLED (v0.1.0 bootloop investigation)',
              'version': '$VERSION-DISABLED',
              'new_install_prompt_erase': False,
              'builds': []
          }
          with open('dist/flasher/manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          "
          
          # Generate CrossPoint restore manifest with SEPARATE PARTS
          # This avoids the ESP32-S3 native USB issue where merged binary writes
          # to early offsets (bootloader/partitions) can fail mid-write
          python3 -c "
          import json
          manifest = {
              'name': 'CrossPoint Reader (Full Restore)',
              'version': 'latest',
              'new_install_prompt_erase': False,
              'builds': [{
                  'chipFamily': 'ESP32-S3',
                  'parts': [
                      {'path': 'firmware/bootloader.bin', 'offset': 0},
                      {'path': 'firmware/partitions.bin', 'offset': 32768},
                      {'path': 'firmware/boot_app0.bin', 'offset': 57344},
                      {'path': 'firmware/crosspoint-x4pro-app.bin', 'offset': 65536}
                  ]
              }]
          }
          with open('dist/flasher/crosspoint-manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          "
          
          echo "=== Flasher site contents ==="
          find dist/flasher -type f -exec ls -la {} \;
          
          echo ""
          echo "=== Generated CrossPoint manifest ==="
          cat dist/flasher/crosspoint-manifest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v$VERSION"
          
          # Check if release exists (for workflow_dispatch)
          if ! gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "margin $VERSION - BOOTLOOP WARNING" \
              --notes "## ⚠️ WARNING: v0.1.0 Causes Bootloop - DO NOT INSTALL

          **The v0.1.0 merged firmware caused a device to bootloop.** margin installation is disabled in the web flasher until the root cause is confirmed fixed.

          ### Root Cause Analysis
          
          The bootloop was caused by **ESP Web Tools failing to write the bootloader area** (0x0-0x10000) when flashing a merged binary with full-chip erase on ESP32-S3 native USB (USB-JTAG-Serial).

          **Evidence:**
          - After flashing, the device's flash at 0x0-0xFFFF was all 0xFF (erased)
          - The merged binary itself had valid data at those offsets (bootloader magic 0xE9 at 0x0, partition table 0xAA50 at 0x8000)
          - ROM log showed: \`invalid header: 0xffffffff\` (no bootloader present)

          **Likely cause:** ESP32-S3's native USB (USB-JTAG-Serial) has known issues with large block writes in ESP Web Tools / esptool-js. The flash was erased successfully, but writing the early blocks (bootloader, partition table) failed silently, leaving them blank.

          **Fix applied:**
          - CrossPoint restore now uses separate parts instead of merged binary
          - \`new_install_prompt_erase: false\` to avoid full-chip erase
          - Each part written individually at its correct offset

          ### Recovery
          
          If your device is bootlooping, see [docs/recovery.md](https://github.com/${{ github.repository }}/blob/main/docs/recovery.md) or use the web flasher to restore CrossPoint:
          https://yakov.khalinsky.com/margin/

          ### Assets (for debugging only)
          - **margin-x4pro-app.bin**: App only (do NOT flash without working bootloader)
          - **firmware/bootloader.bin**: Stock CrossPoint bootloader (offset 0x0)
          - **firmware/partitions.bin**: Stock CrossPoint partition table (offset 0x8000)
          - **firmware/boot_app0.bin**: OTA data init (offset 0xe000)
          - **firmware/crosspoint-x4pro-app.bin**: Stock CrossPoint app (offset 0x10000)
          "
          fi
          
          # Upload assets
          gh release upload "$TAG" \
            dist/margin-x4pro-app.bin \
            dist/firmware/bootloader.bin \
            dist/firmware/partitions.bin \
            dist/firmware/boot_app0.bin \
            dist/firmware/crosspoint-x4pro-app.bin \
            --repo "${{ github.repository }}" \
            --clobber

  deploy-pages:
    needs: [build, release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/flasher/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
