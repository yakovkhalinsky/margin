name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Setup firmware environment
        run: |
          cd firmware
          ./scripts/setup.sh

      - name: Build margin firmware (X4 Pro)
        run: |
          cd firmware/upstream/crosspoint-reader
          pio run -e margin_x4pro

      - name: Install esptool
        run: pip install esptool

      - name: Check flash settings match official CrossPoint
        run: |
          # Download official CrossPoint X4 Pro binary
          curl -fsSL -o /tmp/official-crosspoint-x4pro.bin \
            "https://github.com/crosspoint-reader/crosspoint-reader/releases/latest/download/firmware-x4pro.bin"
          
          MARGIN_FW="firmware/upstream/crosspoint-reader/.pio/build/margin_x4pro/firmware.bin"
          MARGIN_BL="firmware/upstream/crosspoint-reader/.pio/build/margin_x4pro/bootloader.bin"
          
          echo "=== Official CrossPoint X4 Pro release ==="
          esptool image-info /tmp/official-crosspoint-x4pro.bin 2>&1 | grep -E "Flash size|Flash freq|Flash mode"
          
          echo ""
          echo "=== margin firmware ==="
          esptool image-info "$MARGIN_FW" 2>&1 | grep -E "Flash size|Flash freq|Flash mode"
          
          echo ""
          echo "=== margin bootloader ==="
          esptool image-info "$MARGIN_BL" 2>&1 | grep -E "Flash size|Flash freq|Flash mode"
          
          # Extract settings for comparison
          OFFICIAL_MODE=$(esptool image-info /tmp/official-crosspoint-x4pro.bin 2>&1 | grep "Flash mode:" | awk '{print $3}')
          OFFICIAL_FREQ=$(esptool image-info /tmp/official-crosspoint-x4pro.bin 2>&1 | grep "Flash freq:" | awk '{print $3}')
          OFFICIAL_SIZE=$(esptool image-info /tmp/official-crosspoint-x4pro.bin 2>&1 | grep "Flash size:" | awk '{print $3}')
          
          MARGIN_MODE=$(esptool image-info "$MARGIN_FW" 2>&1 | grep "Flash mode:" | awk '{print $3}')
          MARGIN_FREQ=$(esptool image-info "$MARGIN_FW" 2>&1 | grep "Flash freq:" | awk '{print $3}')
          MARGIN_SIZE=$(esptool image-info "$MARGIN_FW" 2>&1 | grep "Flash size:" | awk '{print $3}')
          
          echo ""
          echo "=== Comparison ==="
          echo "Official: mode=$OFFICIAL_MODE freq=$OFFICIAL_FREQ size=$OFFICIAL_SIZE"
          echo "margin:   mode=$MARGIN_MODE freq=$MARGIN_FREQ size=$MARGIN_SIZE"
          
          # Fail if settings don't match
          if [ "$OFFICIAL_MODE" != "$MARGIN_MODE" ]; then
            echo "ERROR: Flash mode mismatch!"
            exit 1
          fi
          if [ "$OFFICIAL_FREQ" != "$MARGIN_FREQ" ]; then
            echo "ERROR: Flash freq mismatch!"
            exit 1
          fi
          if [ "$OFFICIAL_SIZE" != "$MARGIN_SIZE" ]; then
            echo "ERROR: Flash size mismatch!"
            exit 1
          fi
          
          echo "✓ All flash settings match official CrossPoint"

      - name: Run host tests
        run: |
          make -C firmware/test

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: margin-x4pro-firmware
          path: firmware/upstream/crosspoint-reader/.pio/build/margin_x4pro/firmware.bin
          retention-days: 7

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run BSB converter tests
        run: python tools/test_bsb_converter.py
